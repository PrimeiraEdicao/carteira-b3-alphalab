name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q app.py src scripts tests
      - name: Run tests
        run: pytest -q
      - name: Validate notebook JSON
        run: python -m json.tool notebooks/Carteira_B3_Automatica_V2.ipynb >/dev/null
